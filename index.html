<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#c8102e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>News &amp; Sets</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f1a;
      --surface: #1a1a2e;
      --surface2: #252540;
      --accent: #c8102e;
      --accent2: #1a6bb5;
      --accent3: #2d8f4e;
      --text: #f0f0f0;
      --text2: #a0a0b0;
      --text3: #6a6a80;
      --border: #2e2e4a;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --player-height: 160px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 16px;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }

    /* ── HEADER ── */
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding-top: var(--safe-top);
      padding-left: var(--safe-left);
      padding-right: var(--safe-right);
    }

    .header-top {
      padding: 14px 16px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-title h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .header-title span {
      font-size: 12px;
      color: var(--text2);
      margin-top: 1px;
      display: block;
    }

    #refresh-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text2);
      padding: 8px 12px;
      cursor: pointer;
      min-width: 44px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #refresh-btn:active { background: var(--surface2); }
    #refresh-btn.loading svg { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── TABS ── */
    .tabs {
      display: flex;
      padding: 0 8px;
    }

    .tab {
      flex: 1;
      background: none;
      border: none;
      color: var(--text2);
      padding: 12px 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: color 0.15s, border-color 0.15s;
      -webkit-tap-highlight-color: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .tab.active {
      color: var(--text);
      border-bottom-color: var(--accent);
    }

    .tab-count {
      font-size: 11px;
      background: var(--surface2);
      padding: 1px 7px;
      border-radius: 10px;
      font-weight: 500;
    }

    .tab.active .tab-count { background: var(--accent); color: #fff; }

    /* ── STATUS BAR ── */
    #status-bar {
      font-size: 12px;
      color: var(--text2);
      padding: 6px calc(16px + var(--safe-right)) 6px calc(16px + var(--safe-left));
      background: var(--bg);
      min-height: 24px;
    }

    /* ── LISTS (shared) ── */
    .list {
      padding: 4px var(--safe-right) calc(var(--player-height) + var(--safe-bottom) + 16px) var(--safe-left);
      display: none;
    }

    .list.active { display: block; }

    /* ── EPISODE CARD (Giacalone) ── */
    .episode-card {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.1s;
      -webkit-user-select: none;
      user-select: none;
    }

    .episode-card:active { background: var(--surface); }
    .episode-card.playing { background: var(--surface); }
    .episode-card.playing .ep-title { color: var(--accent); }

    .ep-header {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ep-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      letter-spacing: 0.5px;
      flex-shrink: 0;
      text-transform: uppercase;
    }

    .ep-badge.opinione { background: var(--accent); color: #fff; }
    .ep-badge.indignato { background: var(--accent2); color: #fff; }
    .ep-badge.deejaytime { background: #f06423; color: #fff; }

    .ep-date { font-size: 12px; color: var(--text2); }
    .ep-title { font-size: 15px; font-weight: 500; line-height: 1.35; }
    .ep-footer { display: flex; align-items: center; gap: 12px; }
    .ep-duration { font-size: 12px; color: var(--text2); }

    .ep-playing-indicator {
      display: none;
      align-items: center;
      gap: 3px;
    }

    .playing .ep-playing-indicator { display: flex; }

    .ep-playing-indicator span {
      display: block;
      width: 3px;
      border-radius: 2px;
      background: var(--accent);
      animation: bar-bounce 0.8s ease-in-out infinite;
    }

    .ep-playing-indicator span:nth-child(1) { height: 8px; animation-delay: 0s; }
    .ep-playing-indicator span:nth-child(2) { height: 14px; animation-delay: 0.15s; }
    .ep-playing-indicator span:nth-child(3) { height: 6px; animation-delay: 0.3s; }

    @keyframes bar-bounce {
      0%, 100% { transform: scaleY(0.4); }
      50% { transform: scaleY(1); }
    }

    /* ── SET CARD (DJ Sets) ── */
    .set-card {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      -webkit-user-select: none;
      user-select: none;
    }

    .set-card.playing { background: var(--surface); }
    .set-card.playing .set-title { color: var(--accent); }

    .set-main {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .set-info {
      flex: 1;
      min-width: 0;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .set-title {
      font-size: 15px;
      font-weight: 500;
      line-height: 1.35;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .set-meta {
      font-size: 12px;
      color: var(--text2);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .set-status {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
    }

    .set-status.offline { color: var(--accent3); }
    .set-status.streaming { color: var(--text3); }

    .set-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .set-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s;
    }

    .set-btn:active { background: var(--surface2); }
    .set-btn.download { color: var(--accent); border-color: var(--accent); }
    .set-btn.delete { color: var(--text3); }

    .set-progress {
      margin-top: 10px;
      display: none;
    }

    .set-card.downloading .set-progress { display: block; }
    .set-card.downloading .set-btn.download { display: none; }

    .progress-track {
      height: 4px;
      background: var(--surface2);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.2s;
    }

    .progress-label {
      font-size: 11px;
      color: var(--text2);
      margin-top: 4px;
    }

    /* ── EMPTY / ERROR ── */
    .empty-state {
      padding: 40px 24px;
      text-align: center;
      color: var(--text2);
      font-size: 14px;
      line-height: 1.6;
    }

    .empty-state code {
      background: var(--surface);
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 12px;
    }

    /* ── SKELETON ── */
    .skeleton-card {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .skeleton-line {
      background: var(--surface);
      border-radius: 4px;
      animation: shimmer 1.5s infinite;
    }

    @keyframes shimmer {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    /* ── STORAGE BAR (DJ Sets only) ── */
    #storage-info {
      display: none;
      padding: 8px calc(16px + var(--safe-right)) 8px calc(16px + var(--safe-left));
      font-size: 11px;
      color: var(--text2);
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }

    .tab-sets.active ~ #storage-info,
    body.tab-sets-active #storage-info { display: block; }

    /* ── PLAYER ── */
    #player {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 10px calc(16px + var(--safe-right)) calc(10px + var(--safe-bottom)) calc(16px + var(--safe-left));
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    #player-meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-height: 36px;
    }

    #player-title {
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #player-show { font-size: 11px; color: var(--text2); }

    #player-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .ctrl-btn {
      background: none;
      border: none;
      color: var(--text);
      cursor: pointer;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }

    .ctrl-btn:active { background: var(--surface2); }
    .ctrl-btn.skip { min-width: 48px; min-height: 48px; flex-direction: column; gap: 1px; }
    .ctrl-btn.skip span { font-size: 9px; color: var(--text2); }
    .ctrl-btn.skip svg { width: 22px; height: 22px; }

    #btn-play-pause {
      width: 56px;
      height: 56px;
      background: var(--accent);
      border-radius: 50%;
      color: #fff;
    }

    #btn-play-pause:active { background: #a00d24; }
    #btn-play-pause svg { width: 28px; height: 28px; }

    #player-progress {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .time-label {
      font-size: 11px;
      color: var(--text2);
      min-width: 36px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    #progress-bar {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      border-radius: 2px;
      outline: none;
      cursor: pointer;
      background: linear-gradient(
        to right,
        var(--accent) 0%,
        var(--accent) var(--prog, 0%),
        var(--border) var(--prog, 0%),
        var(--border) 100%
      );
    }

    #progress-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      box-shadow: 0 0 0 2px rgba(200,16,46,0.3);
    }

    #player.idle #player-controls,
    #player.idle #player-progress { opacity: 0.35; pointer-events: none; }
  </style>
</head>

  <div class="header-top">
    <div class="header-title">
      <h1>News &amp; Sets</h1>
      <span id="header-subtitle">RTL 102.5 · DJ Mixes</span>

    <button id="refresh-btn" title="Aggiorna">

<script>
// ═══════════════════════════════════════════════════════════════════════════
//  CONFIG
// ═══════════════════════════════════════════════════════════════════════════

// Cloudflare Worker (CORS proxy for RTL RSS feeds)
const CF_WORKER = 'https://newsfeed.giacomosangalli25.workers.dev';

// Cloudflare R2 bucket public URL — REPLACE with your bucket's r2.dev URL
// Example: 'https://pub-abc123.r2.dev'
const R2_BASE = 'https://YOUR-R2-BUCKET.r2.dev';

const FEEDS = [
  { url: 'https://rss.rtl.it/podcast/l-opinione-di-davide-giacalone', label: 'Opinione', badgeClass: 'opinione', audioOnly: true },
  { url: 'https://rss.rtl.it/podcast/l-indignato-speciale-il-podcast', label: 'Indignato Speciale', badgeClass: 'indignato', audioOnly: true },
];

const DEEJAY_TIME_INDEX = 'https://www.m2o.it/programmi/deejay-time/puntate/';

const EP_CACHE_KEY = 'episodes_v2';
const EP_CACHE_TS  = 'episodes_ts_v2';
const DEEJAY_TIME_CACHE_KEY = 'deejay_time_episodes_v1';
const DEEJAY_TIME_CACHE_TS  = 'deejay_time_episodes_ts_v1';
const SETS_CACHE_KEY = 'sets_manifest_v1';
const SETS_CACHE_TS  = 'sets_manifest_ts_v1';
const CACHE_TTL = 60 * 60 * 1000;
const DJ_CACHE_NAME = 'dj-sets-v1';

// ═══════════════════════════════════════════════════════════════════════════
//  UTILITIES
// ═══════════════════════════════════════════════════════════════════════════

function formatTime(sec) {
  if (!sec || isNaN(sec) || !isFinite(sec)) return '0:00';
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = Math.floor(sec % 60);
  if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  return `${m}:${String(s).padStart(2,'0')}`;
}

function formatDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  if (isNaN(d)) return dateStr;
  return d.toLocaleDateString('it-IT', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
}

function parseDuration(str) {
  if (!str) return 0;
  if (typeof str === 'number') return str;
  const parts = String(str).split(':').map(Number);
  if (parts.length === 3) return parts[0]*3600 + parts[1]*60 + parts[2];
  if (parts.length === 2) return parts[0]*60 + parts[1];
  return parseInt(str, 10) || 0;
}

function formatDuration(str) {
  const sec = parseDuration(str);
  if (!sec) return '';
  return formatTime(sec);
}

function formatBytes(b) {
  if (!b) return '0 B';
  const u = ['B', 'KB', 'MB', 'GB'];
  let i = 0;
  while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
  return `${b.toFixed(i === 0 ? 0 : 1)} ${u[i]}`;
}

function escHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ═══════════════════════════════════════════════════════════════════════════
//  CORS PROXY
// ═══════════════════════════════════════════════════════════════════════════

async function fetchWithProxy(feedUrl) {
  const proxies = [
    url => `${CF_WORKER}?url=${encodeURIComponent(url)}`,
    url => `https://corsproxy.io/?url=${encodeURIComponent(url)}`,
    url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
  ];
  let lastErr;
  for (const buildUrl of proxies) {
    try {
      const res = await fetch(buildUrl(feedUrl), { signal: AbortSignal.timeout(8000) });
      if (res.ok) return await res.text();
    } catch (e) { lastErr = e; }
  }
  throw lastErr || new Error('All proxies failed');
}

// ═══════════════════════════════════════════════════════════════════════════
//  RSS PARSING (Giacalone)
// ═══════════════════════════════════════════════════════════════════════════

function parseRSS(xmlText, feed) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(xmlText, 'application/xml');
  if (doc.querySelector('parsererror')) throw new Error('RSS parse error');

  const items = Array.from(doc.querySelectorAll('item'));
  const episodes = [];
  const seen = new Set();

  for (const item of items) {
    const enclosure = item.querySelector('enclosure');
    if (!enclosure) continue;
    const type = enclosure.getAttribute('type') || '';
    if (feed.audioOnly && type !== 'audio/mpeg') continue;

    const guid = item.querySelector('guid')?.textContent?.trim() || enclosure.getAttribute('url');
    if (seen.has(guid)) continue;
    seen.add(guid);

    const audioUrl = enclosure.getAttribute('url');
    if (!audioUrl) continue;

    const title = item.querySelector('title')?.textContent?.trim() || 'Episodio';
    const pubDate = item.querySelector('pubDate')?.textContent?.trim() || '';
    const duration = item.querySelector('duration')?.textContent?.trim() ||
                     item.getElementsByTagNameNS('*', 'duration')[0]?.textContent?.trim() || '';

    episodes.push({
      kind: 'episode',
      guid, title, pubDate,
      pubDateMs: pubDate ? new Date(pubDate).getTime() : 0,
      duration, audioUrl,
      label: feed.label,
      badgeClass: feed.badgeClass,
    });
  }
  return episodes;
}

async function fetchAllEpisodes() {
  const results = await Promise.allSettled(
    FEEDS.map(f => fetchWithProxy(f.url).then(xml => parseRSS(xml, f)))
  );
  const all = [];
  results.forEach((r, i) => {
    if (r.status === 'fulfilled') all.push(...r.value);
    else console.warn(`Feed ${FEEDS[i].label} failed:`, r.reason);
  });
  if (all.length === 0) throw new Error('No episodes loaded');
  all.sort((a, b) => b.pubDateMs - a.pubDateMs);
  return all;
}

// ═══════════════════════════════════════════════════════════════════════════
//  DJ SETS (R2 manifest)
// ═══════════════════════════════════════════════════════════════════════════

// Deejay Time is published as HTML pages rather than an RSS feed.
async function fetchM2oPage(pageUrl) {
  const res = await fetch(`${CF_WORKER}?url=${encodeURIComponent(pageUrl)}`, {
    signal: AbortSignal.timeout(12000),
  });
  if (!res.ok) throw new Error(`m2o proxy failed: ${res.status}`);
  return await res.text();
}

function parseDeejayTimeEpisode(html, pageUrl) {
  const dateMatch = pageUrl.match(/deejay-time-del-(\d{2})-(\d{2})-(\d{4})/i);
  const audioMatch = html.match(/"audio_url"\s*:\s*"([^"]+)"/i);
  if (!dateMatch || !audioMatch) return null;

  const [, day, month, year] = dateMatch;
  const duration = html.match(/"duration"\s*:\s*"([^"]+)"/i)?.[1] || '';
  const audioUrl = audioMatch[1].replace(/\\\//g, '/');
  const pubDate = `${year}-${month}-${day}T14:00:00`;

  return {
    kind: 'deejaytime',
    guid: pageUrl,
    title: `Puntata del ${day}/${month}/${year}`,
    pubDate,
    pubDateMs: new Date(pubDate).getTime(),
    duration,
    audioUrl,
    label: 'Deejay Time',
    badgeClass: 'deejaytime',
    sourceUrl: pageUrl,
  };
}

async function fetchDeejayTimeEpisodes() {
  const indexHtml = await fetchM2oPage(DEEJAY_TIME_INDEX);
  const doc = new DOMParser().parseFromString(indexHtml, 'text/html');
  const pageUrls = [...new Set(
    Array.from(doc.querySelectorAll('a[href*="/programmi/deejay-time/puntate/deejay-time-del-"]'))
      .map(a => new URL(a.getAttribute('href'), DEEJAY_TIME_INDEX).href)
  )].slice(0, 24);

  if (!pageUrls.length) throw new Error('No Deejay Time episode links found');
  const results = await Promise.allSettled(
    pageUrls.map(pageUrl => fetchM2oPage(pageUrl).then(html => parseDeejayTimeEpisode(html, pageUrl)))
  );
  const episodes = results
    .filter(r => r.status === 'fulfilled' && r.value)
    .map(r => r.value)
    .sort((a, b) => b.pubDateMs - a.pubDateMs);
  if (!episodes.length) throw new Error('No Deejay Time episodes loaded');
  return episodes;
}

async function fetchSetsManifest() {
  if (R2_BASE.includes('YOUR-R2-BUCKET')) throw new Error('R2_BASE not configured');
  const res = await fetch(`${R2_BASE}/sets.json`, { cache: 'no-cache' });
  if (!res.ok) throw new Error(`Manifest fetch failed: ${res.status}`);
  const data = await res.json();
  const sets = (data.sets || []).map(s => ({
    kind: 'set',
    guid: s.id || s.file,
    title: s.title || s.file,
    artist: s.artist || '',
    pubDate: s.date || '',
    pubDateMs: s.date ? new Date(s.date).getTime() : 0,
    duration: s.duration || '',
    size: s.size || 0,
    audioUrl: `${R2_BASE}/${s.file}`,
    label: 'DJ Set',
  }));
  sets.sort((a, b) => b.pubDateMs - a.pubDateMs);
  return sets;
}

// ═══════════════════════════════════════════════════════════════════════════
//  LOCAL CACHE (small key/value)
// ═══════════════════════════════════════════════════════════════════════════

function saveCache(key, tsKey, data) {
  try {
    localStorage.setItem(key, JSON.stringify(data));
    localStorage.setItem(tsKey, Date.now().toString());
  } catch {}
}

function loadCache(key, tsKey) {
  try {
    const ts = parseInt(localStorage.getItem(tsKey) || '0', 10);
    const data = localStorage.getItem(key);
    if (!data) return null;
    return { data: JSON.parse(data), fresh: Date.now() - ts < CACHE_TTL };
  } catch { return null; }
}

// ═══════════════════════════════════════════════════════════════════════════
//  DJ SET DOWNLOAD / CACHE API
// ═══════════════════════════════════════════════════════════════════════════

async function isSetCached(url) {
  try {
    const cache = await caches.open(DJ_CACHE_NAME);
    const match = await cache.match(url);
    return !!match;
  } catch { return false; }
}

async function downloadSet(set, onProgress) {
  const cache = await caches.open(DJ_CACHE_NAME);
  const response = await fetch(set.audioUrl);
  if (!response.ok) throw new Error(`Download failed: ${response.status}`);

  const total = parseInt(response.headers.get('content-length') || '0', 10);
  const reader = response.body.getReader();
  const chunks = [];
  let received = 0;

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
    received += value.length;
    if (onProgress) onProgress(received, total);
  }

  const blob = new Blob(chunks, { type: 'audio/mpeg' });
  const cachedResponse = new Response(blob, {
    headers: {
      'Content-Type': 'audio/mpeg',
      'Content-Length': String(blob.size),
    },
  });
  await cache.put(set.audioUrl, cachedResponse);
  return blob.size;
}

async function deleteSet(set) {
  const cache = await caches.open(DJ_CACHE_NAME);
  await cache.delete(set.audioUrl);
  try { localStorage.removeItem(`pos_${set.guid}`); } catch {}
}

async function updateStorageInfo() {
  if (!navigator.storage?.estimate) return;
  try {
    const est = await navigator.storage.estimate();
    const cache = await caches.open(DJ_CACHE_NAME);
    const keys = await cache.keys();
    document.getElementById('storage-used').textContent =
      `${keys.length} set · ${formatBytes(est.usage || 0)} su ${formatBytes(est.quota || 0)} disponibili`;
  } catch (e) { console.warn(e); }
}

// ═══════════════════════════════════════════════════════════════════════════
//  PLAYER
// ═══════════════════════════════════════════════════════════════════════════

const audio = document.getElementById('audio-el');
let currentItem = null;
let isDragging = false;
let saveTimer = null;

function savePosition(guid, time) {
  try { localStorage.setItem(`pos_${guid}`, Math.floor(time).toString()); } catch {}
}

function loadPosition(guid) {
  return parseInt(localStorage.getItem(`pos_${guid}`) || '0', 10);
}

function playItem(item) {
  currentItem = item;
  document.getElementById('player-title').textContent = item.title;
  document.getElementById('player-show').textContent =
    item.kind === 'deejaytime'
      ? 'Deejay Time - m2o'
      : item.kind === 'set'
      ? (item.artist ? `${item.artist} — DJ Set` : 'DJ Set')
      : `${item.label} — RTL 102.5`;
  document.getElementById('player').classList.remove('idle');

  if (audio.src !== item.audioUrl) {
    audio.src = item.audioUrl;
    audio.load();
    const savedPos = loadPosition(item.guid);
    if (savedPos > 10) {
      audio.addEventListener('loadedmetadata', function onMeta() {
        audio.currentTime = savedPos;
        audio.removeEventListener('loadedmetadata', onMeta);
      });
    }
  }

  audio.play().catch(e => console.warn('Play failed:', e));
  updatePlayingHighlight(item.guid);
  updateMediaSession(item);
}

function updatePlayingHighlight(guid) {
  document.querySelectorAll('.episode-card, .set-card, .deejaytime-card').forEach(card => {
    card.classList.toggle('playing', card.dataset.guid === guid);
  });
}

function setPlayPauseIcon(playing) {
  document.getElementById('icon-play').style.display = playing ? 'none' : '';
  document.getElementById('icon-pause').style.display = playing ? '' : 'none';
}

audio.addEventListener('play', () => setPlayPauseIcon(true));
audio.addEventListener('pause', () => setPlayPauseIcon(false));
audio.addEventListener('ended', () => setPlayPauseIcon(false));

audio.addEventListener('timeupdate', () => {
  if (isDragging || !audio.duration) return;
  const pct = (audio.currentTime / audio.duration) * 100;
  const bar = document.getElementById('progress-bar');
  bar.value = pct;
  bar.style.setProperty('--prog', pct + '%');
  document.getElementById('time-current').textContent = formatTime(audio.currentTime);
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    if (currentItem) savePosition(currentItem.guid, audio.currentTime);
  }, 10000);
});

audio.addEventListener('loadedmetadata', () => {
  document.getElementById('time-total').textContent = formatTime(audio.duration);
});

document.getElementById('btn-play-pause').addEventListener('click', () => {
  if (!currentItem) return;
  audio.paused ? audio.play() : audio.pause();
});

document.getElementById('btn-skip-back').addEventListener('click', () => {
  if (!audio.src) return;
  audio.currentTime = Math.max(0, audio.currentTime - 30);
});

document.getElementById('btn-skip-fwd').addEventListener('click', () => {
  if (!audio.src) return;
  audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 30);
});

const progressBar = document.getElementById('progress-bar');
progressBar.addEventListener('pointerdown', () => { isDragging = true; });
progressBar.addEventListener('input', () => {
  if (!audio.duration) return;
  const pct = parseFloat(progressBar.value);
  progressBar.style.setProperty('--prog', pct + '%');
  document.getElementById('time-current').textContent = formatTime((pct / 100) * audio.duration);
});
progressBar.addEventListener('change', () => {
  isDragging = false;
  if (!audio.duration) return;
  audio.currentTime = (parseFloat(progressBar.value) / 100) * audio.duration;
  if (currentItem) savePosition(currentItem.guid, audio.currentTime);
});

function updateMediaSession(item) {
  if (!('mediaSession' in navigator)) return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title: item.title,
    artist: item.kind === 'deejaytime'
      ? 'Deejay Time — m2o'
      : item.kind === 'set'
        ? (item.artist || 'DJ Set')
        : 'Davide Giacalone — RTL 102.5',
    album: item.label,
    artwork: [
      { src: 'icon-192.png', sizes: '192x192', type: 'image/png' },
      { src: 'icon-512.png', sizes: '512x512', type: 'image/png' },
    ],
  });
  navigator.mediaSession.setActionHandler('play', () => audio.play());
  navigator.mediaSession.setActionHandler('pause', () => audio.pause());
  navigator.mediaSession.setActionHandler('seekbackward', () => {
    audio.currentTime = Math.max(0, audio.currentTime - 30);
  });
  navigator.mediaSession.setActionHandler('seekforward', () => {
    audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 30);
  });
}

// ═══════════════════════════════════════════════════════════════════════════
//  RENDER — Giacalone episodes
// ═══════════════════════════════════════════════════════════════════════════

function renderEpisodes(eps) {
  const list = document.getElementById('episode-list');
  document.getElementById('count-giacalone').textContent = eps.length;
  if (!eps.length) {
    list.innerHTML = '<p class="empty-state">Nessun episodio trovato.</p>';
    return;
  }
  list.innerHTML = eps.map(ep => `
    <div class="episode-card" data-guid="${escHtml(ep.guid)}" role="button" tabindex="0">
      <div class="ep-header">
        <span class="ep-badge ${ep.badgeClass}">${ep.label === 'Opinione' ? 'Opinione' : 'Indignato'}</span>
        <span class="ep-date">${escHtml(formatDate(ep.pubDate))}</span>
      </div>
      <div class="ep-title">${escHtml(ep.title)}</div>
      <div class="ep-footer">
        ${ep.duration ? `<span class="ep-duration">${formatDuration(ep.duration)}</span>` : ''}
        <div class="ep-playing-indicator"><span></span><span></span><span></span></div>
      </div>
    </div>
  `).join('');
  list.querySelectorAll('.episode-card').forEach((card, i) => {
    card.addEventListener('click', () => playItem(eps[i]));
  });
  if (currentItem) updatePlayingHighlight(currentItem.guid);
}

// ═══════════════════════════════════════════════════════════════════════════
//  RENDER — DJ Sets
// ═══════════════════════════════════════════════════════════════════════════

function renderDeejayTimeEpisodes(eps) {
  const list = document.getElementById('deejaytime-list');
  document.getElementById('count-deejaytime').textContent = eps.length;
  if (!eps.length) {
    list.innerHTML = '<p class="empty-state">Nessuna puntata di Deejay Time trovata.</p>';
    return;
  }
  list.innerHTML = eps.map(ep => `
    <div class="episode-card deejaytime-card" data-guid="${escHtml(ep.guid)}" role="button" tabindex="0">
      <div class="ep-header">
        <span class="ep-badge deejaytime">Deejay Time</span>
        <span class="ep-date">${escHtml(formatDate(ep.pubDate))}</span>
      </div>
      <div class="ep-title">${escHtml(ep.title)}</div>
      <div class="ep-footer">
        ${ep.duration ? `<span class="ep-duration">${formatDuration(ep.duration)}</span>` : ''}
        <div class="ep-playing-indicator"><span></span><span></span><span></span></div>
      </div>
    </div>
  `).join('');
  list.querySelectorAll('.deejaytime-card').forEach((card, i) => {
    card.addEventListener('click', () => playItem(eps[i]));
    card.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') playItem(eps[i]);
    });
  });
  if (currentItem) updatePlayingHighlight(currentItem.guid);
}

async function renderSets(sets) {
  const list = document.getElementById('set-list');
  document.getElementById('count-sets').textContent = sets.length;

  if (R2_BASE.includes('YOUR-R2-BUCKET')) {
    list.innerHTML = `
      <p class="empty-state">
        Per attivare i DJ Sets:<br><br>
        1. Crea un bucket R2 su Cloudflare<br>
        2. Attiva il public URL (<code>r2.dev</code>)<br>
        3. Carica i tuoi MP3 + un file <code>sets.json</code><br>
        4. Sostituisci <code>R2_BASE</code> nel codice<br>
      </p>`;
    return;
  }

  if (!sets.length) {
    list.innerHTML = '<p class="empty-state">Nessun set disponibile.<br>Aggiungi MP3 al bucket R2 e aggiorna <code>sets.json</code>.</p>';
    return;
  }

  // Check which are cached
  const cacheStatus = await Promise.all(sets.map(s => isSetCached(s.audioUrl)));

  list.innerHTML = sets.map((s, i) => {
    const cached = cacheStatus[i];
    return `
      <div class="set-card ${cached ? 'cached' : ''}" data-guid="${escHtml(s.guid)}" data-idx="${i}">
        <div class="set-main">
          <div class="set-info">
            <div class="set-title">${escHtml(s.title)}</div>
            <div class="set-meta">
              ${s.artist ? `<span>${escHtml(s.artist)}</span>` : ''}
              ${s.pubDate ? `<span>${escHtml(formatDate(s.pubDate))}</span>` : ''}
              ${s.duration ? `<span>${escHtml(formatDuration(s.duration))}</span>` : ''}
              <span class="set-status ${cached ? 'offline' : 'streaming'}">
                ${cached ? '✓ Offline' : '⬇ Online'}
              </span>
            </div>
          </div>
          <div class="set-actions">
            ${cached
              ? `<button class="set-btn delete" data-action="delete" title="Elimina">
                   <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>
                 </button>`
              : `<button class="set-btn download" data-action="download" title="Scarica per offline">
                   <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                 </button>`
            }
          </div>
        </div>
        <div class="set-progress">
          <div class="progress-track"><div class="progress-fill"></div></div>
          <div class="progress-label">In download…</div>
        </div>
      </div>`;
  }).join('');

  // Wire up handlers
  list.querySelectorAll('.set-card').forEach(card => {
    const idx = parseInt(card.dataset.idx, 10);
    const set = sets[idx];

    card.querySelector('.set-info').addEventListener('click', () => playItem(set));

    const dlBtn = card.querySelector('[data-action="download"]');
    if (dlBtn) {
      dlBtn.addEventListener('click', async e => {
        e.stopPropagation();
        await handleDownload(card, set, sets);
      });
    }

    const delBtn = card.querySelector('[data-action="delete"]');
    if (delBtn) {
      delBtn.addEventListener('click', async e => {
        e.stopPropagation();
        if (!confirm(`Eliminare "${set.title}" dalla memoria offline?`)) return;
        await deleteSet(set);
        await renderSets(sets);
        await updateStorageInfo();
      });
    }
  });

  if (currentItem) updatePlayingHighlight(currentItem.guid);
}

async function handleDownload(card, set, allSets) {
  card.classList.add('downloading');
  const fill = card.querySelector('.progress-fill');
  const label = card.querySelector('.progress-label');
  try {
    await downloadSet(set, (received, total) => {
      const pct = total ? (received / total) * 100 : 0;
      fill.style.width = pct + '%';
      label.textContent = total
        ? `${formatBytes(received)} / ${formatBytes(total)} (${pct.toFixed(0)}%)`
        : `${formatBytes(received)} scaricati…`;
    });
    await renderSets(allSets);
    await updateStorageInfo();
  } catch (err) {
    label.textContent = `Errore: ${err.message}`;
    setTimeout(() => card.classList.remove('downloading'), 2000);
  }
}

// ═══════════════════════════════════════════════════════════════════════════
//  TABS
// ═══════════════════════════════════════════════════════════════════════════

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.tab === tab);
  });
  document.querySelectorAll('.list').forEach(l => {
    l.classList.toggle('active', l.dataset.list === tab);
  });
  document.body.classList.toggle('tab-sets-active', tab === 'sets');
  document.getElementById('storage-info').style.display = tab === 'sets' ? 'block' : 'none';
  try { localStorage.setItem('active_tab', tab); } catch {}
  if (tab === 'sets') updateStorageInfo();
}

document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => switchTab(t.dataset.tab));
});

// ═══════════════════════════════════════════════════════════════════════════
//  STATUS / LOAD
// ═══════════════════════════════════════════════════════════════════════════

function setStatus(msg) {
  document.getElementById('status-bar').textContent = msg;
}

function showSkeleton(listEl) {
  listEl.innerHTML = Array.from({ length: 4 }, () => `
    <div class="skeleton-card">
      <div class="skeleton-line" style="height:12px; width:30%"></div>
      <div class="skeleton-line" style="height:16px; width:85%"></div>
      <div class="skeleton-line" style="height:11px; width:20%"></div>
    </div>`).join('');
}

async function loadEpisodes(force = false) {
  const cached = loadCache(EP_CACHE_KEY, EP_CACHE_TS);
  if (cached) {
    renderEpisodes(cached.data);
    if (!force && cached.fresh) return;
  } else {
    showSkeleton(document.getElementById('episode-list'));
  }
  try {
    const eps = await fetchAllEpisodes();
    saveCache(EP_CACHE_KEY, EP_CACHE_TS, eps);
    renderEpisodes(eps);
  } catch (err) {
    console.error('Episodes load failed:', err);
    if (!cached) {
      document.getElementById('episode-list').innerHTML =
        '<p class="empty-state">Impossibile caricare gli episodi.<br>Verifica connessione.</p>';
    }
  }
}

async function loadDeejayTimeEpisodes(force = false) {
  const cached = loadCache(DEEJAY_TIME_CACHE_KEY, DEEJAY_TIME_CACHE_TS);
  if (cached) {
    renderDeejayTimeEpisodes(cached.data);
    if (!force && cached.fresh) return;
  } else {
    showSkeleton(document.getElementById('deejaytime-list'));
  }
  try {
    const eps = await fetchDeejayTimeEpisodes();
    saveCache(DEEJAY_TIME_CACHE_KEY, DEEJAY_TIME_CACHE_TS, eps);
    renderDeejayTimeEpisodes(eps);
  } catch (err) {
    console.error('Deejay Time load failed:', err);
    if (!cached) {
      document.getElementById('deejaytime-list').innerHTML =
        '<p class="empty-state">Impossibile caricare Deejay Time.<br>Verifica connessione.</p>';
    }
  }
}

async function loadSets(force = false) {
  const cached = loadCache(SETS_CACHE_KEY, SETS_CACHE_TS);
  if (cached) {
    renderSets(cached.data);
    if (!force && cached.fresh) return;
  } else {
    showSkeleton(document.getElementById('set-list'));
  }
  try {
    const sets = await fetchSetsManifest();
    saveCache(SETS_CACHE_KEY, SETS_CACHE_TS, sets);
    renderSets(sets);
  } catch (err) {
    console.warn('Sets load failed:', err);
    if (!cached) renderSets([]);
  }
}

async function refreshAll() {
  const btn = document.getElementById('refresh-btn');
  btn.classList.add('loading');
  setStatus('Aggiornamento in corso…');
  await Promise.allSettled([loadEpisodes(true), loadDeejayTimeEpisodes(true), loadSets(true)]);
  const ep = JSON.parse(localStorage.getItem(EP_CACHE_KEY) || '[]');
  const dt = JSON.parse(localStorage.getItem(DEEJAY_TIME_CACHE_KEY) || '[]');
  const ss = JSON.parse(localStorage.getItem(SETS_CACHE_KEY) || '[]');
  setStatus(`${ep.length} Giacalone · ${dt.length} Deejay Time · ${ss.length} set`);
  btn.classList.remove('loading');
}

document.getElementById('refresh-btn').addEventListener('click', refreshAll);

  if (lastTab === 'sets') updateStorageInfo();
})();
